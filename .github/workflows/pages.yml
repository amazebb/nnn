# Build the web pages (docs/index.html, docs/changes.html and docs/install.html from their .md, docs/man.html from nnn.1) with the
# sitegen tools and publish them to GitHub Pages. The generated files are not tracked.
name: Pages

on:
  push:
    branches: [amazebb]
    paths:
      - 'docs/**'
      - 'nnn.1'
      - 'FORK.md'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the sitegen tools and theme
        uses: actions/checkout@v4
        with:
          repository: amazebb/sitegen
          path: sitegen
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Build the pages
        run: make docs SITEGEN="$GITHUB_WORKSPACE/sitegen"
      - name: Assemble the site
        run: |
          mkdir _site
          cp docs/index.html docs/changes.html docs/install.html docs/man.html docs/style.css docs/site.css docs/script.js _site/
          cp -R docs/img _site/
          cp -R docs/fonts _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
