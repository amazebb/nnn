<!doctype html>
<html lang="en">
<head>
@include(head.html)@
  <title>@TITLE@</title>
  <meta name="description" content="@DESCRIPTION@">
</head>
<body>
<main>

@include(nav.html)@

  <header id="top">
    <h1>n3: nnn, with a <em><span class="thin">fi</span>n<span class="flip"><span class="f">3</span><span class="b" aria-hidden="true">e</span></span><span class="thin">r</span></em> finish.</h1>
    <p>@intro@</p>
    <div class="cta">
      <a class="btn primary" href="#install">Install</a>
      <a class="btn" href="https://github.com/amazebb/nnn">View on GitHub</a>
    </div>
  </header>

  <figure class="shot" id="shot">
    <!-- split Dark|Light switch for the screenshots only, unused for now (script.js and style.css still support it):
    <div class="theme-switch" role="group" aria-label="Screenshot theme, for every screenshot on the page">
      <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      <button type="button" data-theme="light" aria-pressed="false">Light</button>
    </div>
    -->
    <img class="th-light" src="img/nnn-list-light.png" width="750" height="465" alt="nnn listing the repo root in a light terminal theme, with the context and path pills on top and the pill status bar below">
    <img class="th-dark" src="img/nnn-list-dark.png" width="750" height="465" alt="nnn listing the repo root in a dark terminal theme, with the context and path pills on top and the pill status bar below">
    <figcaption>A <a href="https://www.nerdfonts.com/">Nerd Font</a> is required to show the pills and icons.</figcaption>
  </figure>

  <div class="facts">
    <div><b>5.3</b><span>base <a href="https://github.com/jarun/nnn">nnn</a> version</span></div>
    <div><b>One file</b><span>nnn.c, under 200 KB binary</span></div>
    <div><b>Plugins</b><span>extend it with your own plugins</span></div>
  </div>

@BODY@

</main>
@include(foot.html)@
</body>
</html>
